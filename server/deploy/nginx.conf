# 家庭点餐 API 伪静态 / 反向代理示例
# Hyperf 跑在 Swoole :9501，由 Nginx 对外提供 80/443，隐藏端口与 index.php。
#
# 使用：复制到 /etc/nginx/conf.d/diancan.conf 后按实际 root / 证书路径修改。

upstream diancan_hyperf {
    server 127.0.0.1:9501;
    keepalive 64;
}

server {
    listen 80;
    server_name api.example.com;
    charset utf-8;

    # 上传静态资源（菜品图）
    location /uploads/ {
        alias /path/to/diancan/server/storage/uploads/;
        expires 30d;
        access_log off;
    }

    # 伪静态：所有动态请求转发到 Hyperf，REST 路径无需 .php / index.php
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://diancan_hyperf;
    }
}
